[package]
name = "converge-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Durable storage for Converge documents: Postgres and in-memory"

[dependencies]
converge-core = { path = "../converge-core" }
converge-proto = { path = "../converge-proto" }
async-trait = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "migrate"] }
thiserror.workspace = true
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
